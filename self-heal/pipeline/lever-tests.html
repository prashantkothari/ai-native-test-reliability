<!doctype html>
<html><head><meta charset="utf-8"><title>S9 — search-and-pick + temporal-wait lever tests</title>
<style>
  body{font:14px/1.5 ui-monospace,Menlo,monospace;max-width:900px;margin:24px auto;padding:0 16px}
  h1{font-size:18px} .ok{color:#137333} .bad{color:#c5221f}
  .row{padding:5px 0;border-bottom:1px solid #eee} .det{color:#555;padding-left:20px;font-size:12px}
  .summary{font-size:16px;margin:12px 0;padding:10px;border-radius:6px}
  .summary.pass{background:#e6f4ea;color:#137333} .summary.fail{background:#fce8e6;color:#c5221f}
  button{font:inherit;padding:6px 12px;margin-bottom:12px}
</style></head><body>
<h1>S9 — search-and-pick + temporal-wait lever tests</h1>
<p>Standalone lever modules; not wired into the live executor by this session. Loads the pristine
core + fixtures (read-only) + the two new levers, then runs pre-registered cases.</p>
<button id="run">Run tests</button>
<div id="out"></div>

<!-- load order: validated core first, then diagnosis taxonomy (context only), fixtures (read-only
     reuse), then the two new lever modules, then the tests -->
<script src="../../selfheal-core.js"></script>
<script src="change-diagnosis.js"></script>
<script src="../pretotype/fixtures.js"></script>
<script src="search-and-pick.js"></script>
<script src="temporal-wait.js"></script>
<script src="lever-tests.js"></script>
<script>
  async function go() {
    const out = document.getElementById('out');
    out.innerHTML = '<div class="row">running…</div>';
    const r = await runLeverTests();
    out.innerHTML = '';
    const sum = document.createElement('div');
    sum.className = 'summary ' + (r.failed ? 'fail' : 'pass');
    sum.textContent = (r.failed ? 'FAIL — ' : 'PASS — ') + r.passed + '/' + r.total + ' passing' + (r.failed ? (' (' + r.failed + ' failed)') : '');
    out.appendChild(sum);
    r.results.forEach(c => {
      const d = document.createElement('div'); d.className = 'row';
      d.innerHTML = '<span class="' + (c.pass ? 'ok' : 'bad') + '">' + (c.pass ? '✓' : '✗') + '</span> ' + c.name +
        '<div class="det">' + c.detail + '</div>';
      out.appendChild(d);
    });
  }
  document.getElementById('run').addEventListener('click', go);
  // auto-run on load too, so a plain page-load + javascript_tool readback of window.__S9_TESTS works.
  go();
</script>
</body></html>
