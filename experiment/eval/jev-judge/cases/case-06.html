<!DOCTYPE html>
<html>
<head><title>Base fixture — real-world-ish controls</title></head>
<body>
  <header>
    <nav aria-label="Global" class="site-nav">
      <a href="/" class="logo" aria-label="Homepage">MySite</a>
      <ul>
        <li><a class="nav-link" href="/products">Products</a></li>
        <li><a class="nav-link" href="/pricing">Pricing</a></li>
        <li><a class="nav-link" href="/docs">Docs</a></li>
      </ul>
      <button type="button" class="btn btn-primary" data-testid="signin">Sign in</button>
      <button type="button" class="icon-btn" aria-label="Toggle menu">☰</button>
    </nav>
  </header>

  <main>
    <h1 id="page-title">Anthropic TypeScript SDK</h1>

    <section class="hero">
      <p>Access Claude models from Node.js and TypeScript applications.</p>
      <a class="btn btn-cta" href="/get-started" data-testid="get-started">Get started</a>
    </section>

    <section class="readme">
      <h2>Installation</h2>
      <pre><code>npm install @anthropic-ai/sdk</code></pre>

      <h2>Search the docs</h2>
      <form class="search-form" role="search">
        <label for="q">Search:</label>
        <input data-eval-truth="1" type="text" id="q" name="q" placeholder="Search docs..." aria-label="Search docs (updated)">
        <button type="submit" class="btn btn-search">Search</button>
      </form>

      <h2>Contributors</h2>
      <ul class="contributors">
        <li><a href="/user/alice" class="contributor-link">alice</a></li>
        <li><a href="/user/bob" class="contributor-link">bob</a></li>
        <li><a href="/user/carol" class="contributor-link">carol</a></li>
      </ul>
    </section>
  </main>

  <footer>
    <a href="/legal/privacy" class="footer-link">Privacy</a>
    <a href="/legal/terms" class="footer-link">Terms</a>
    <button type="button" class="btn btn-ghost" data-testid="feedback">Send feedback</button>
  </footer>
</body>
</html>
